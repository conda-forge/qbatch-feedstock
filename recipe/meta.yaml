{% set name = "qbatch" %}
{% set version = "2.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/qbatch-{{ version }}.tar.gz
  sha256: 20ecc2599bfe2f207e947f5f2d16872c6e15feceaa2f1a4f9f52b47940bafaa2

build:
  entry_points:
    - qbatch=qbatch:qbatchParser
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=2.7
    - pip
  run:
    - python >=2.7
    - future
    - imp

test:
  imports:
    - qbatch
  commands:
    - pip check
    - qbatch --help
  requires:
    - pip

about:
  home: https://github.com/pipitone/qbatch
  summary: Execute shell command lines in parallel on Slurm, S(un|on of) Grid Engine (SGE) and PBS/Torque clusters
  license: Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaeakle
